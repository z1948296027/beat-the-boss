<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>解压乱打模拟器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    html, body {
      touch-action: manipulation;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .container {
      width: 100%;
      max-width: 780px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .char-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .char-list, .top-tools { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .pill-btn {
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .pill-btn.active { background: #2563eb; border-color: #3b82f6; color: #fff; }
    .money-pill {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #475569;
      background: #0f172a;
      font-family: monospace;
      font-weight: 700;
      color: #facc15;
      font-size: 12px;
    }
    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .bar-head { display: flex; justify-content: space-between; margin-bottom: 4px; font-weight: 600; }
    .bar-track { height: 10px; border-radius: 999px; background: #0f172a; border: 1px solid #334155; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; transition: width 0.08s linear; }
    .canvas-wrap {
      position: relative;
      width: 100%;
      height: 340px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      margin-bottom: 10px;
    }
    canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
    .quick-bar {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      flex-wrap: wrap;
    }
    .quick-group { display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; }
    .deskmate-btn {
      padding: 6px 9px;
      border-radius: 8px;
      border: 1px solid rgba(251, 191, 36, 0.65);
      background: rgba(15, 23, 42, 0.88);
      color: #fef3c7;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .deskmate-btn:active { transform: scale(0.95); }
    .hidden { display: none !important; }
    .banner {
      display: none;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #dc2626;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: none;
    }
    .banner.show { display: flex; align-items: center; gap: 6px; }
    kbd { background: #fff; color: #b91c1c; padding: 1px 6px; border-radius: 4px; font-family: monospace; font-weight: 800; }
    .overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
    }
    .overlay.show { display: flex; }
    .shop-card {
      width: 100%;
      max-width: 440px;
      max-height: 316px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #1e293b;
      border: 1px solid rgba(168, 85, 247, 0.45);
      border-radius: 10px;
      padding: 8px 10px;
    }
    .controls { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    button.act-btn {
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      border-radius: 10px;
      padding: 8px 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-weight: 600;
      font-size: 12px;
      transition: transform 0.08s, border-color 0.15s, opacity 0.15s;
    }
    button.act-btn:hover { border-color: #60a5fa; }
    button.act-btn:active { transform: scale(0.95); }
    .sub { font-size: 10px; color: #94a3b8; font-weight: 500; }
    .dim { opacity: 0.45; }
    @keyframes pulseDanger {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
      50% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
    }
    .pulse-danger {
      animation: pulseDanger 0.65s infinite;
      border-color: #ef4444 !important;
      background: rgba(239, 68, 68, 0.2) !important;
      opacity: 1 !important;
    }
  </style>
</head>

        }

        for (const f of state.fists) {
          const ease = Math.sin(Math.min(1, f.t / f.duration) * Math.PI);
          ctx.save(); ctx.translate(bc.x + f.side * (70 - ease * 52), bc.y + 90 - ease * 100);
          ctx.scale((f.energy ? 1.05 : 0.8) + ease * 0.55, (f.energy ? 1.05 : 0.8) + ease * 0.55);
          ctx.font = '42px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(f.energy ? '🧤' : '👊', 0, 0); ctx.restore();
        }

        if (state.explosionFlash > 0) { ctx.fillStyle = `rgba(255, 200, 80, ${state.explosionFlash})`; ctx.fillRect(0, 0, w, h); }
        if (state.healFlash > 0) { ctx.fillStyle = `rgba(74, 222, 128, ${state.healFlash})`; ctx.fillRect(0, 0, w, h); }
        if (state.energyFlash > 0) { ctx.fillStyle = `rgba(192, 132, 252, ${state.energyFlash})`; ctx.fillRect(0, 0, w, h); }

        for (const proj of state.bossProjectiles) {
          ctx.save(); ctx.translate(proj.x, proj.y); ctx.scale(proj.scale, proj.scale);
          ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.roundRect(-28, -12, 56, 24, 6); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(proj.label, 0, 0); ctx.restore();
        }
        for (const pt of state.particles) { ctx.save(); ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife); ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
        for (const ft of state.floatTexts) { ctx.save(); ctx.globalAlpha = Math.max(0, ft.alpha); ctx.font = `900 ${ft.size}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(15,23,42,0.85)'; ctx.strokeText(ft.text, ft.x, ft.y); ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y); ctx.restore(); }
        if (isRage) { ctx.strokeStyle = `rgba(239, 68, 68, ${0.45 + Math.sin(state.time * 12) * 0.15})`; ctx.lineWidth = 14; ctx.strokeRect(0, 0, w, h); }
        ctx.restore();
      }

      let lastTs = performance.now(), projTimer = 0;
      function loop(ts) {
        const dt = Math.min(0.05, (ts - lastTs) / 1000); lastTs = ts;
        if (!state.shopOpen) {
          state.time += dt; const damp = Math.exp(-14 * dt);
          state.bossRecoilX *= damp; state.bossRecoilY *= damp; state.bossRecoilRot *= damp; state.shake *= Math.exp(-15 * dt);
          if (state.bossHurtTimer > 0) state.bossHurtTimer = Math.max(0, state.bossHurtTimer - dt);
          if (state.bossDizzyTimer > 0) state.bossDizzyTimer = Math.max(0, state.bossDizzyTimer - dt);
          if (state.slapMarkTimer > 0) state.slapMarkTimer = Math.max(0, state.slapMarkTimer - dt);
          if (state.sootTimer > 0) state.sootTimer = Math.max(0, state.sootTimer - dt);
          if (state.explosionFlash > 0) state.explosionFlash = Math.max(0, state.explosionFlash - dt * 1.4);
          if (state.healFlash > 0) state.healFlash = Math.max(0, state.healFlash - dt * 1.2);
          if (state.energyFlash > 0) state.energyFlash = Math.max(0, state.energyFlash - dt * 1.4);
          if (state.latiaoBuffTimer > 0) state.latiaoBuffTimer = Math.max(0, state.latiaoBuffTimer - dt);
          if (state.vomitTimer > 0) state.vomitTimer = Math.max(0, state.vomitTimer - dt);

          if (state.stinkTimer > 0 && state.mode !== 'gameover') {
            state.stinkTimer = Math.max(0, state.stinkTimer - dt);
            state.stinkTickTimer += dt;
            if (state.stinkTickTimer >= 2.0 && state.stinkRemainingDmg > 0) {
              state.stinkTickTimer -= 2.0; state.stinkRemainingDmg -= 1;
              const bc = getBossCenter(); damageTarget(1);
              addFloatText('🧪 熏臭 -1', bc.x + (Math.random() * 44 - 22), bc.y - 46, '#a3e635', 14);
              spawnParticles(bc.x, bc.y - 18, '#84cc16', 4, 80, 2.2); updateHUD();
            }
            if (state.stinkTimer <= 0) state.stinkRemainingDmg = 0;
          }

          if (state.mode !== 'gameover') {
            state.deskmateAutoTimer += dt;
            if (state.deskmateAutoTimer >= 3.0) { state.deskmateAutoTimer = 0; giveMoneyFromDeskmate(20, false); }
          }

          if (state.speechTimer > 0) state.speechTimer -= dt;
          else if (state.mode === 'normal' && Math.random() < dt * 0.35) { state.speech = pick(curChar().idleQuotes); state.speechTimer = 2.6; }

          if (state.weaponAnim) { state.weaponAnim.t += dt; if (state.weaponAnim.t >= state.weaponAnim.duration) state.weaponAnim = null; }
          for (let i = state.fists.length - 1; i >= 0; i--) { state.fists[i].t += dt; if (state.fists[i].t >= state.fists[i].duration) state.fists.splice(i, 1); }

          const punching = state.fHeld || state.btnFistHeld;
          if (punching && (state.mode === 'counterattack' || (state.mode === 'normal' && state.hasEnergyGlove))) triggerFistPunch();

          if (state.mode === 'counterattack') {
            state.hp = Math.max(0, state.hp - (punching ? 5.5 : 16.5) * dt);
            state.shieldTimer -= dt;
            if (state.shieldTimer <= 0) { state.shieldTimer = 2.8; triggerShieldAttack(); }
            projTimer += dt;
            if (projTimer >= 0.42) {
              projTimer = 0; const bc = getBossCenter();
              state.bossProjectiles.push({ x: bc.x + (Math.random() * 60 - 30), y: bc.y - 10, vx: (Math.random() - 0.5) * 210, vy: 100 + Math.random() * 80, scale: 0.7, label: pick(curChar().projectiles) });
            }
            updateHUD();
            if (state.hp <= 0) {
              state.mode = 'gameover'; state.fHeld = false; state.btnFistHeld = false;
              gameoverTitle.textContent = curChar().gameoverMsg;
              gameoverStats.innerHTML = `<span>击败次数: ${state.defeats}</span><span>击退反击: ${state.countersBroken}</span><span>金币: ${state.money}</span>`;
              gameoverOverlay.classList.add('show'); updateHUD();
            }
          }

          for (let i = state.bossProjectiles.length - 1; i >= 0; i--) { const p = state.bossProjectiles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.scale += dt * 1.1; if (p.y > canvas.clientHeight + 40) state.bossProjectiles.splice(i, 1); }
          for (let i = state.particles.length - 1; i >= 0; i--) { const pt = state.particles[i]; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 380 * dt; pt.life -= dt; if (pt.life <= 0) state.particles.splice(i, 1); }
          for (let i = state.floatTexts.length - 1; i >= 0; i--) { const ft = state.floatTexts[i]; ft.y += ft.vy * dt; ft.alpha -= dt * 1.1; if (ft.alpha <= 0) state.floatTexts.splice(i, 1); }
        }
        draw(); requestAnimationFrame(loop);
      }

      charBtns.forEach(btn => btn.addEventListener('click', () => selectCharacter(btn.dataset.char)));
      btnBat.addEventListener('click', attackWithBat);
      btnSlap.addEventListener('click', attackWithSlap);
      btnPhone.addEventListener('click', attackWithPhone);
      btnStink.addEventListener('click', attackWithStinkWater);
      btnCola.addEventListener('click', drinkCola);
      deskmateBtn.addEventListener('click', e => {
        e.stopPropagation();
        const now = performance.now(); if (now - state.lastDeskmateClick < 400) return;
        state.lastDeskmateClick = now; giveMoneyFromDeskmate(15, true);
      });
      shopBtn.addEventListener('click', () => state.shopOpen ? closeShop() : openShop());
      closeShopBtn.addEventListener('click', closeShop);
      buyGloveBtn.addEventListener('click', buyEnergyGlove);
      buyLatiaoBtn.addEventListener('click', buyLatiao);
      buyLatiaoBoxBtn.addEventListener('click', buyLatiaoBox);
      buyToyGunBtn.addEventListener('click', buyToyGun);
      buyHammerBtn.addEventListener('click', buyHammer);
      buyPistolBtn.addEventListener('click', buyPistol);
      btnLatiao.addEventListener('click', e => { e.stopPropagation(); eatLatiao(); });
      btnHammer.addEventListener('click', e => { e.stopPropagation(); attackWithHammer(); });
      btnToyGun.addEventListener('click', e => { e.stopPropagation(); attackWithToyGun(); });
      btnPistol.addEventListener('click', e => { e.stopPropagation(); attackWithPistol(); });
      btnFist.addEventListener('pointerdown', e => { e.preventDefault(); state.btnFistHeld = true; triggerFistPunch(); });
      window.addEventListener('pointerup', () => { state.btnFistHeld = false; });
      btnFist.addEventListener('pointerleave', () => { state.btnFistHeld = false; });
      canvas.addEventListener('pointerdown', () => {
        if (state.shopOpen) return;
        if (state.mode === 'counterattack') triggerFistPunch();
        else if (state.mode === 'normal') {
          if (state.activeWeapon === 'bat') attackWithBat();
          else if (state.activeWeapon === 'slap') attackWithSlap();
          else if (state.activeWeapon === 'stink') attackWithStinkWater();
          else attackWithPhone();
        }
      });
      btnReset.addEventListener('click', resetGame);
      restartOverlayBtn.addEventListener('click', resetGame);
      muteBtn.addEventListener('click', () => { muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; });

      window.addEventListener('keydown', e => {
        if (state.shopOpen) { if (e.code === 'Escape') closeShop(); return; }
        if (e.code === 'KeyF' || e.key === 'f' || e.key === 'F') { e.preventDefault(); state.fHeld = true; triggerFistPunch(); }
        else if (e.code === 'Digit1' || e.key === '1') attackWithBat();
        else if (e.code === 'Digit2' || e.key === '2') attackWithSlap();
        else if (e.code === 'Digit3' || e.key === '3') attackWithPhone();
        else if (e.code === 'Digit4' || e.key === '4') drinkCola();
        else if (e.code === 'Digit5' || e.key === '5') eatLatiao();
        else if (e.code === 'Digit6' || e.key === '6') attackWithToyGun();
        else if (e.code === 'Digit7' || e.key === '7') attackWithPistol();
        else if (e.code === 'Digit8' || e.key === '8') attackWithStinkWater();
        else if (e.code === 'Digit9' || e.key === '9') attackWithHammer();
      });
      window.addEventListener('keyup', e => { if (e.code === 'KeyF' || e.key === 'f' || e.key === 'F') state.fHeld = false; });
      window.addEventListener('blur', () => { state.fHeld = false; state.btnFistHeld = false; });
      window.addEventListener('resize', resizeCanvas);
      document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
      document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
      document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });

      resizeCanvas(); updateHUD(); requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
